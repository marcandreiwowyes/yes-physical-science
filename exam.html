<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Isaac Newton Quiz</title>
<link rel="stylesheet" href="exam.css">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0b1026, #182650, #090d1c);
 
}
.quiz-container{
       color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;

}

.quiz-container {
    width: 100%;
    max-width: 750px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    padding: 35px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
}

h1 {
    text-align: center;
    font-size: 36px;
    margin-bottom: 10px;
}

.subtitle {
    text-align: center;
    color: #c9d2ff;
    margin-bottom: 30px;
}

.top-bar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
    font-size: 16px;
}

.progress {
    width: 100%;
    height: 8px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 30px;
}

.progress-bar {
    height: 100%;
    width: 10%;
    background: #7d9cff;
    transition: width 0.3s;
}

.question {
    font-size: 24px;
    margin-bottom: 25px;
    line-height: 1.4;
}

.answers {
    display: grid;
    gap: 14px;
}

.answer {
    background: rgba(255,255,255,0.08);
    border: 2px solid rgba(255,255,255,0.2);
    color: white;
    padding: 16px;
    border-radius: 12px;
    cursor: pointer;
    font-size: 17px;
    text-align: left;
    transition: 0.2s;
}

.answer:hover {
    background: rgba(255,255,255,0.16);
    transform: translateY(-2px);
}
.yes{
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 50px;
}

.answer.correct {
    background: #1f7a4d;
    border-color: #4ee596;
}

.answer.wrong {
    background: #8a3030;
    border-color: #ff6b6b;
}

.answer:disabled {
    cursor: not-allowed;
}

.next-btn {
    width: 100%;
    margin-top: 25px;
    padding: 15px;
    border: none;
    border-radius: 12px;
    background: #637cff;
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: none;
}

.next-btn:hover {
    background: #5069e8;
}

.result {
    text-align: center;
    display: none;
}

.result h2 {
    font-size: 32px;
    margin-bottom: 15px;
}

.final-score {
    font-size: 55px;
    font-weight: bold;
    margin: 20px 0;
    color: #9eafff;
}

.restart-btn {
    padding: 14px 30px;
    border: none;
    border-radius: 10px;
    background: #637cff;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.restart-btn:hover {
    background: #5069e8;
}

@media(max-width:600px) {
    .quiz-container {
        padding: 25px;
    }

    h1 {
        font-size: 28px;
    }

    .question {
        font-size: 20px;
    }
}
</style>
</head>

<body>
     <nav class="navbar">
        <div class="navdiv">
            <div class="logo"><a href="">ISAAC NEWTON</a></div>
            <ul class="nav-links">
                <li><a href="home.html">HOME</a></li>
                <li><a href="ingame.html">GAMES</a></li>
                <li><a href="exam.html">QUIZ</a></li>
                <li><a href="contact.html">CONTACT</a></li>
            </ul>
            <div class="nav-actions">
                <a href="pick.html"><img src="logout.png" width="30" height="30" class="sign"></a>
                <button type="button" id="learnMoreBtn" class="yesd">LEARN MORE</button>
                <button type="button" id="themeToggle" class="theme-toggle">Night</button>
            </div>
        </div>
    </nav>
    <div class="yes">

        
        <div class="quiz-container">
            
            <div id="quiz">
                
        <h1>Isaac Newton Quiz</h1>
        <p class="subtitle">Test your knowledge about the life and discoveries of Isaac Newton.</p>

        <div class="top-bar">
            <span id="question-number">Question 1 of 10</span>
            <span id="score">Score: 0</span>
        </div>
        
        <div class="progress">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        
        <div class="question" id="question"></div>

        <div class="answers" id="answers"></div>

        <button class="next-btn" id="next-btn" onclick="nextQuestion()">
            Next Question
        </button>

    </div>

    <div class="result" id="result">
        <h2>Quiz Complete!</h2>
        <p>Your final score is:</p>

        <div class="final-score" id="final-score">0/10</div>

        <p id="message"></p>
        
        <button class="restart-btn" onclick="restartQuiz()">
            Try Again
        </button>
    </div>

</div>

</div>
<script>
const questions = [
    {
        question: "When was Isaac Newton born?",
        answers: ["1643", "1650", "1666", "1701"],
        correct: "1643"
    },
    {
        question: "Which famous laws did Isaac Newton develop?",
        answers: [
            "Three Laws of Motion",
            "Three Laws of Electricity",
            "Three Laws of Chemistry",
            "Three Laws of Light"
        ],
        correct: "Three Laws of Motion"
    },
    {
        question: "Sinong mananalo?",
        answers: ["Yema ni sir Migs", "Graham ball na square ni SP", "Overpriced pen ni Talens", "Kagawad"],
        correct: "Yema ni sir Migs"
    },
    {
        question: "What object is famously associated with Newton's study of gravity?",
        answers: ["Apple", "Stone", "Moon", "Book"],
        correct: "Apple"
    },
    {
        question: "Which famous book did Newton publish in 1687?",
        answers: [
            "Principia Mathematica",
            "The Origin of Species",
            "The Mathematical Universe",
            "Opticks and Astronomy"
        ],
        correct: "Principia Mathematica"
    },
    {
        question: "Anong English ng kalsada?",
        answers: [
            "Apollo G",
            "Talong",
            "yes",
            "Ron"
        ],
        correct: "Talong"
    },
    {
        question: "Which mathematical field is Newton commonly credited with developing independently?",
        answers: [
            "Calculus",
            "Statistics",
            "Number theory",
            "Probability"
        ],
        correct: "Calculus"
    },
    {
        question: "What does Newton's Second Law describe?",
        answers: [
            "The relationship between force, mass, and acceleration",
            "Objects remaining at rest",
            "The speed of light",
            "The movement of sound"
        ],
        correct: "The relationship between force, mass, and acceleration"
    },
    {
        question: "What did Newton discover about white light using a prism?",
        answers: [
            "White light can be separated into different colors",
            "White light cannot be changed",
            "Light only contains three colors",
            "Prisms create light"
        ],
        correct: "White light can be separated into different colors"
    },
    {
        question: "Where did Isaac Newton spend much of his academic career?",
        answers: [
            "University of Cambridge",
            "University of Oxford",
            "Harvard University",
            "University of London"
        ],
        correct: "University of Cambridge"
    }
];

let currentQuestion = 0;
let score = 0;
let answered = false;

const questionElement = document.getElementById("question");
const answersElement = document.getElementById("answers");
const questionNumber = document.getElementById("question-number");
const scoreElement = document.getElementById("score");
const progressBar = document.getElementById("progress-bar");
const nextButton = document.getElementById("next-btn");

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function loadQuestion() {
    answered = false;
    nextButton.style.display = "none";

    const current = questions[currentQuestion];

    questionElement.textContent = current.question;

    questionNumber.textContent =
        "Question " + (currentQuestion + 1) + " of " + questions.length;

    progressBar.style.width =
        ((currentQuestion + 1) / questions.length) * 100 + "%";

    answersElement.innerHTML = "";

    const shuffledAnswers = shuffle([...current.answers]);

    shuffledAnswers.forEach(answer => {
        const button = document.createElement("button");

        button.classList.add("answer");
        button.textContent = answer;

        button.onclick = () => selectAnswer(answer, button);

        answersElement.appendChild(button);
    });
}

function selectAnswer(selectedAnswer, button) {
    if (answered) return;

    answered = true;

    const correctAnswer = questions[currentQuestion].correct;
    const allAnswers = document.querySelectorAll(".answer");

    allAnswers.forEach(answerButton => {
        answerButton.disabled = true;

        if (answerButton.textContent === correctAnswer) {
            answerButton.classList.add("correct");
        }
    });

    if (selectedAnswer === correctAnswer) {
        score++;
        scoreElement.textContent = "Score: " + score;
    } else {
        button.classList.add("wrong");
    }

    nextButton.style.display = "block";

    if (currentQuestion === questions.length - 1) {
        nextButton.textContent = "See Final Score";
    }
}

function nextQuestion() {
    currentQuestion++;

    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("quiz").style.display = "none";
    document.getElementById("result").style.display = "block";

    document.getElementById("final-score").textContent =
        score + "/" + questions.length;

    let message;

    if (score === 10) {
        message = "Excellent! You have mastered the basics of Isaac Newton.";
    } else if (score >= 8) {
        message = "Great job! You have a strong understanding of Isaac Newton.";
    } else if (score >= 5) {
        message = "Good effort! Review a few facts and try again.";
    } else {
        message = "Keep studying! You can improve your score with another attempt.";
    }

    document.getElementById("message").textContent = message;
}

function restartQuiz() {
    currentQuestion = 0;
    score = 0;

    scoreElement.textContent = "Score: 0";

    document.getElementById("quiz").style.display = "block";
    document.getElementById("result").style.display = "none";

    nextButton.textContent = "Next Question";

    loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
